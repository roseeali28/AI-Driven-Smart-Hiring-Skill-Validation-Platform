<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Feedback</title>

```
<link rel="stylesheet" href="style.css">
```

</head>

<body>

<div class="container">

```
<h1>Feedback</h1>

<form id="feedbackForm">

    <label>
        Your Name
    </label>

    <input
        type="text"
        id="name"
        placeholder="Enter your name"
        required
    >

    <label>
        Your Feedback
    </label>

    <textarea
        id="feedback"
        placeholder="Write your feedback here"
        required
    ></textarea>

    <button type="submit">
        Submit Feedback
    </button>

</form>

<p id="message"></p>
```

</div>

<script>

document
.getElementById("feedbackForm")
.addEventListener("submit", function(e) {

    e.preventDefault();

    document
    .getElementById("message")
    .innerText =
        "Thank you for your feedback!";

    document
    .getElementById("feedbackForm")
    .reset();

});

</script>

</body>
</html>
