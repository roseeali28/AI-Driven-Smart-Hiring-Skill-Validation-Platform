<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Post Job</title>

```
<link rel="stylesheet" href="style.css">
```

</head>

<body>

<div class="container">

```
<h1>Post a Job</h1>

<form id="jobForm">

    <label>
        Job Title
    </label>

    <input
        type="text"
        id="title"
        placeholder="Enter job title"
        required
    >

    <label>
        Job Description
    </label>

    <textarea
        id="description"
        placeholder="Enter job description"
        required
    ></textarea>

    <label>
        Qualifications Required
    </label>

    <textarea
        id="qualifications"
        placeholder="Enter required qualifications"
        required
    ></textarea>

    <button type="submit">
        Post Job
    </button>

</form>

<p id="message"></p>
```

</div>

<script>

document
.getElementById("jobForm")
.addEventListener("submit", async function(e) {

    e.preventDefault();

    const title =
        document.getElementById("title").value;

    const description =
        document.getElementById("description").value;

    const qualifications =
        document.getElementById("qualifications").value;

    try {

        const response =
            await fetch("/api/jobs", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    title,
                    description,
                    qualifications
                })

            });

        if (response.ok) {

            document
            .getElementById("message")
            .innerText =
                "Job posted successfully!";

            document
            .getElementById("jobForm")
            .reset();

        }

        else {

            document
            .getElementById("message")
            .innerText =
                "Failed to post job.";

        }

    }

    catch (error) {

        console.error(error);

    }

});

</script>

</body>
</html>
