<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Resume Analyzer</title>

```
<link rel="stylesheet" href="style.css">
```

</head>

<body>

<div class="container">

```
<h1>Resume Analyzer</h1>

<form id="resumeForm">

    <label>
        Upload Resume
    </label>

    <input
        type="file"
        id="resumeFile"
        accept=".pdf,.doc,.docx"
        required
    >

    <button type="submit">
        Analyze Resume
    </button>

</form>

<div id="analysisResult">

    <p>
        Upload your resume to get feedback.
    </p>

</div>
```

</div>

<script>

document
.getElementById("resumeForm")
.addEventListener("submit", function(e) {

    e.preventDefault();

    const result =
        document.getElementById(
            "analysisResult"
        );

    result.innerHTML = `

        <h3>Analysis Result</h3>

        <p>
            Resume uploaded successfully.
            Analysis feature can be connected
            to backend AI service.
        </p>

    `;

});

</script>

</body>
</html>
